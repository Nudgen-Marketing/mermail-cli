name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version without v prefix
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release version
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - run: npm run check
      - name: Tag the exact versioned source commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - run: npm publish --provenance --access public
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --generate-notes
